<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tour Virtuale 360° VR Universale</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: sans-serif; }
        #vr-button {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            padding: 16px 32px;
            background: #008CBA;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            z-index: 999;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <button id="vr-button" onclick="startVR()">ENTRA IN VR (360°)</button>

    <script>
    // =========================================================================
    // CONFIGURAZIONE PANNELLUM (Incolla qui qualsiasi configurazione Pannellum!)
    // =========================================================================
    const pannellumConfig = {
        "default": {
            "firstScene": "scuola"
        },
        "scenes": {
            "scuola": {
                "title": "Ingresso Scuola",
                "panorama": "foto/scuola.jpg",
                "hotSpots": [
                    { "pitch": -5, "yaw": 100, "type": "scene", "text": "Vai alla Rotonda", "sceneId": "rotonda" },
                    { "pitch": 10, "yaw": -30, "type": "info", "text": "Scuola Secondaria" }
                ]
            },
            "rotonda": {
                "title": "Rotonda Stradale",
                "panorama": "foto/rotonda.jpg",
                "hotSpots": [
                    { "pitch": -5, "yaw": -80, "type": "scene", "text": "Torna alla Scuola", "sceneId": "scuola" },
                    { "pitch": -5, "yaw": 90, "type": "scene", "text": "Prosegui verso la Lidl", "sceneId": "lidl" }
                ]
            },
            "lidl": {
                "title": "Supermercato Lidl",
                "panorama": "foto/lidl.jpg",
                "hotSpots": [
                    { "pitch": -5, "yaw": -120, "type": "scene", "text": "Torna alla Rotonda", "sceneId": "rotonda" },
                    { "pitch": 12, "yaw": 15, "type": "info", "text": "Lidl - Aperto 8:00-20:00" }
                ]
            }
        }
    };

    // =========================================================================
    // MOTORE WEBXR GENERICO (Non toccare questo codice)
    // =========================================================================
    let scene, camera, renderer, sphere, textureLoader;
    let controller1, controller2;
    let raycaster, tempMatrix = new THREE.Matrix4();
    let currentHotspotGroup = null; // Contenitore unico per facile pulizia
    let interactiveObjects = [];

    function convertPitchYawToVector(pitch, yaw, radius = 15) {
        const phi = THREE.MathUtils.degToRad(90 - pitch);
        const theta = THREE.MathUtils.degToRad(yaw + 180);
        const x = -(radius * Math.sin(phi) * Math.sin(theta));
        const y = radius * Math.cos(phi);
        const z = radius * Math.sin(phi) * Math.cos(theta);
        return new THREE.Vector3(x, y, z);
    }

    function createTextSprite(text, isScene) {
        const canvas = document.createElement('canvas');
        const context = canvas.getContext('2d');
        canvas.width = 512;
        canvas.height = 128;

        context.fillStyle = 'rgba(0, 0, 0, 0.75)';
        context.beginPath();
        context.roundRect(10, 10, 492, 108, 20);
        context.fill();

        context.lineWidth = 4;
        context.strokeStyle = isScene ? '#008CBA' : '#FFA500';
        context.stroke();

        context.font = 'Bold 32px Arial';
        context.fillStyle = '#FFFFFF';
        context.textAlign = 'center';
        context.textBaseline = 'middle';
        
        const label = (isScene ? "➔ " : "ℹ ") + text;
        context.fillText(label, 256, 64);

        const texture = new THREE.CanvasTexture(canvas);
        const spriteMaterial = new THREE.SpriteMaterial({ map: texture, depthTest: false });
        const sprite = new THREE.Sprite(spriteMaterial);
        sprite.scale.set(3.5, 0.875, 1);
        return sprite;
    }

    function init() {
        scene = new THREE.Scene();
        camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.xr.enabled = true;
        document.body.appendChild(renderer.domElement);

        // Sfera 360
        const geometry = new THREE.SphereGeometry(500, 60, 40);
        geometry.scale(-1, 1, 1);

        textureLoader = new THREE.TextureLoader();
        sphere = new THREE.Mesh(geometry, new THREE.MeshBasicMaterial());
        scene.add(sphere);

        raycaster = new THREE.Raycaster();
        setupControllers();

        // Carica la prima scena definita nella configurazione
        const firstSceneKey = pannellumConfig.default.firstScene || Object.keys(pannellumConfig.scenes)[0];
        loadScene(firstSceneKey);

        renderer.setAnimationLoop(() => renderer.render(scene, camera));
        window.addEventListener('resize', onWindowResize);
    }

    function setupControllers() {
        controller1 = renderer.xr.getController(0);
        controller1.addEventListener('selectstart', onSelectStart);
        scene.add(controller1);

        controller2 = renderer.xr.getController(1);
        controller2.addEventListener('selectstart', onSelectStart);
        scene.add(controller2);

        const laserGeometry = new THREE.BufferGeometry().setFromPoints([
            new THREE.Vector3(0, 0, 0),
            new THREE.Vector3(0, 0, -10)
        ]);
        const laserMaterial = new THREE.LineBasicMaterial({ color: 0x008CBA });

        controller1.add(new THREE.Line(laserGeometry, laserMaterial));
        controller2.add(new THREE.Line(laserGeometry, laserMaterial));
    }

    function loadScene(sceneKey) {
        const sceneData = pannellumConfig.scenes[sceneKey];
        if (!sceneData) return;

        // 1. Carica la nuova foto
        textureLoader.load(sceneData.panorama, (texture) => {
            sphere.material.map = texture;
            sphere.material.needsUpdate = true;
        });

        // 2. Pulizia TOTALE e garantita dei vecchi hotspot
        if (currentHotspotGroup) {
            scene.remove(currentHotspotGroup);
        }
        currentHotspotGroup = new THREE.Group();
        scene.add(currentHotspotGroup);
        interactiveObjects = [];

        // 3. Generazione Dinamica degli Hotspot letti da Pannellum
        if (sceneData.hotSpots) {
            sceneData.hotSpots.forEach(hs => {
                const pos = convertPitchYawToVector(hs.pitch, hs.yaw, 15);
                const isScene = hs.type === 'scene';

                const hsNode = new THREE.Group();
                hsNode.position.copy(pos);

                // Indicatore 3D (Sfera)
                const hsGeo = new THREE.SphereGeometry(0.25, 32, 32);
                const hsMat = new THREE.MeshBasicMaterial({ color: isScene ? 0x008CBA : 0xFFA500 });
                const hsMesh = new THREE.Mesh(hsGeo, hsMat);
                hsNode.add(hsMesh);

                // Etichetta di testo
                const sprite = createTextSprite(hs.text || '', isScene);
                sprite.position.set(0, 0.6, 0);
                hsNode.add(sprite);

                // Assegna dati di navigazione
                hsMesh.userData = { 
                    type: hs.type, 
                    targetScene: hs.sceneId 
                };

                currentHotspotGroup.add(hsNode);

                // Se è un cambio scena, lo rende interattivo per il raggio del controller
                if (isScene) {
                    interactiveObjects.push(hsMesh);
                }
            });
        }
    }

    function onSelectStart(event) {
        const controller = event.target;
        tempMatrix.identity().extractRotation(controller.matrixWorld);

        raycaster.ray.origin.setFromMatrixPosition(controller.matrixWorld);
        raycaster.ray.direction.set(0, 0, -1).applyMatrix4(tempMatrix);

        const intersects = raycaster.intersectObjects(interactiveObjects);

        if (intersects.length > 0) {
            const hitObj = intersects[0].object;
            if (hitObj.userData.type === 'scene' && hitObj.userData.targetScene) {
                loadScene(hitObj.userData.targetScene);
            }
        }
    }

    function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    }

    async function startVR() {
        if (!navigator.xr) {
            alert("WebXR non supportato.");
            return;
        }

        try {
            const session = await navigator.xr.requestSession('immersive-vr', {
                optionalFeatures: ['local-floor', 'bounded-floor']
            });
            renderer.xr.setSession(session);
            document.getElementById('vr-button').style.display = 'none';

            session.addEventListener('end', () => {
                document.getElementById('vr-button').style.display = 'block';
            });
        } catch (e) {
            alert("Impossibile avviare la VR: " + e.message);
        }
    }

    window.onload = init;
    </script>
</body>
</html>
