<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tour Virtuale 360° VR</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: sans-serif; }
        #vr-button {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            padding: 16px 32px;
            background: #008CBA;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            z-index: 999;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
    </style>
    <!-- Three.js monolitico per evitare problemi di moduli/CDN su Wolvic -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <button id="vr-button" onclick="startVR()">ENTRA IN VR (360°)</button>

    <script>
        let scene, camera, renderer, sphere, textureLoader;
        let currentScene = 'scuola';

        const scenes = {
            'scuola': 'foto/scuola.jpg',
            'rotonda': 'foto/rotonda.jpg',
            'lidl': 'foto/lidl.jpg'
        };

        function init() {
            // 1. Scena e Fotocamera
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);

            // 2. Renderer WebGL con WebXR Abilitato
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.xr.enabled = true;
            document.body.appendChild(renderer.domElement);

            // 3. Geometria Sferica 360° (Invertita per vederla dall'interno)
            const geometry = new THREE.SphereGeometry(500, 60, 40);
            geometry.scale(-1, 1, 1);

            textureLoader = new THREE.TextureLoader();
            const material = new THREE.MeshBasicMaterial();
            sphere = new THREE.Mesh(geometry, material);
            scene.add(sphere);

            // Carica la prima scena
            loadPanorama(scenes[currentScene]);

            // Avvia il loop di rendering
            renderer.setAnimationLoop(() => {
                renderer.render(scene, camera);
            });

            window.addEventListener('resize', onWindowResize);
        }

        function loadPanorama(url) {
            textureLoader.load(url, (texture) => {
                sphere.material.map = texture;
                sphere.material.needsUpdate = true;
            });
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // Avvio della Sessione VR Nativa
        async function startVR() {
            if (!navigator.xr) {
                alert("WebXR non supportato su questo browser.");
                return;
            }

            try {
                const session = await navigator.xr.requestSession('immersive-vr', {
                    optionalFeatures: ['local-floor', 'bounded-floor']
                });
                
                renderer.xr.setSession(session);
                document.getElementById('vr-button').style.display = 'none';

                session.addEventListener('end', () => {
                    document.getElementById('vr-button').style.display = 'block';
                });
            } catch (e) {
                alert("Impossibile avviare la VR: " + e.message);
            }
        }

        // Inizializza al caricamento
        window.onload = init;
    </script>
</body>
</html>
