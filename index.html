<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tour Virtuale 360° VR Nativo</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: sans-serif; }
        #enter-vr {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            padding: 14px 28px;
            background: #008CBA;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            z-index: 10;
        }
    </style>
    <!-- Importazione Three.js Nativo per VR -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/webxr/VRButton.js"></script>
</head>
<body>

    <button id="enter-vr">CARICAMENTO TOUR...</button>

    <script>
        // Configurazione delle Scene
        const scenes = {
            "scuola": {
                panorama: "foto/scuola.jpg",
                nextScene: "rotonda",
                label: "Vai alla Rotonda"
            },
            "rotonda": {
                panorama: "foto/rotonda.jpg",
                nextScene: "lidl",
                label: "Vai alla Lidl"
            },
            "lidl": {
                panorama: "foto/lidl.jpg",
                nextScene: "scuola",
                label: "Torna alla Scuola"
            }
        };

        let currentSceneKey = "scuola";

        // Setup Scena Three.js
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.xr.enabled = true; // Attiva WebXR NATIVO
        document.body.appendChild(renderer.domElement);

        // Geometria Sferica per proiettare la foto 360° senza distorsioni
        const geometry = new THREE.SphereGeometry(500, 60, 40);
        geometry.scale(-1, 1, 1); // Inverte la sfera per vederla dall'interno

        const textureLoader = new THREE.TextureLoader();
        let material = new THREE.MeshBasicMaterial();
        const sphere = new THREE.Mesh(geometry, material);
        scene.add(sphere);

        // Caricamento Foto
        function loadPanorama(key) {
            textureLoader.load(scenes[key].panorama, (texture) => {
                material.map = texture;
                material.needsUpdate = true;
            });
        }
        loadPanorama(currentSceneKey);

        // Tasto VR Nativo
        const vrButton = VRButton.createButton(renderer);
        document.body.appendChild(vrButton);
        document.getElementById('enter-vr').style.display = 'none';

        // Ridimensionamento Finestra
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Loop di Rendering VR
        renderer.setAnimationLoop(() => {
            renderer.render(scene, camera);
        });
    </script>
</body>
</html>
