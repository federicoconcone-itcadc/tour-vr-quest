<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tour Virtuale 360° VR Nativo</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: sans-serif; }
        #vr-button {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            padding: 16px 32px;
            background: #008CBA;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            z-index: 999;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
    </style>
    <!-- Three.js monolitico -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <button id="vr-button" onclick="startVR()">ENTRA IN VR (360°)</button>

    <script>
        let scene, camera, renderer, sphere, textureLoader;
        let controller1, controller2;
        let raycaster, tempMatrix = new THREE.Matrix4();
        let interactiveObjects = [];
        let currentSceneKey = 'scuola';

        // Definizione Dati delle Scene e degli Hotspot 3D
        const scenesData = {
            'scuola': {
                panorama: 'foto/scuola.jpg',
                hotspots: [
                    { position: [2, 0, -4], target: 'rotonda', text: 'Vai alla Rotonda' }
                ]
            },
            'rotonda': {
                panorama: 'foto/rotonda.jpg',
                hotspots: [
                    { position: [-3, 0, -4], target: 'scuola', text: 'Torna alla Scuola' },
                    { position: [3, 0, -4], target: 'lidl', text: 'Prosegui alla Lidl' }
                ]
            },
            'lidl': {
                panorama: 'foto/lidl.jpg',
                hotspots: [
                    { position: [-3, 0, -4], target: 'rotonda', text: 'Torna alla Rotonda' }
                ]
            }
        };

        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.xr.enabled = true;
            document.body.appendChild(renderer.domElement);

            // Sfera Panorama 360°
            const geometry = new THREE.SphereGeometry(500, 60, 40);
            geometry.scale(-1, 1, 1);

            textureLoader = new THREE.TextureLoader();
            const material = new THREE.MeshBasicMaterial();
            sphere = new THREE.Mesh(geometry, material);
            scene.add(sphere);

            // Raycaster per intercettare i click dei controller sui pulsanti
            raycaster = new THREE.Raycaster();

            // Configurazione Controller VR (Raggi Laser)
            setupControllers();

            // Carica la prima scena con i relativi hotspot
            loadScene('scuola');

            renderer.setAnimationLoop(render);
            window.addEventListener('resize', onWindowResize);
        }

        function setupControllers() {
            // Controller 1 (Mano Destra/Sinistra)
            controller1 = renderer.xr.getController(0);
            controller1.addEventListener('selectstart', onSelectStart);
            scene.add(controller1);

            // Controller 2
            controller2 = renderer.xr.getController(1);
            controller2.addEventListener('selectstart', onSelectStart);
            scene.add(controller2);

            // Aggiungi un raggio visibile a ciascun controller
            const laserGeometry = new THREE.BufferGeometry().setFromPoints([
                new THREE.Vector3(0, 0, 0),
                new THREE.Vector3(0, 0, -5)
            ]);
            const laserMaterial = new THREE.LineBasicMaterial({ color: 0x008CBA });

            const line1 = new THREE.Line(laserGeometry, laserMaterial);
            controller1.add(line1);

            const line2 = new THREE.Line(laserGeometry, laserMaterial);
            controller2.add(line2);
        }

        function loadScene(key) {
            currentSceneKey = key;
            const data = scenesData[key];

            // 1. Cambia lo sfondo 360°
            textureLoader.load(data.panorama, (texture) => {
                sphere.material.map = texture;
                sphere.material.needsUpdate = true;
            });

            // 2. Rimuovi i vecchi hotspot dalla scena
            interactiveObjects.forEach(obj => scene.remove(obj));
            interactiveObjects = [];

            // 3. Genera i nuovi Hotspot 3D
            data.hotspots.forEach(hs => {
                const hsGroup = new THREE.Group();
                hsGroup.position.set(...hs.position);

                // Sfera azzurra per l'hotspot
                const hsGeo = new THREE.SphereGeometry(0.3, 32, 32);
                const hsMat = new THREE.MeshBasicMaterial({ color: 0x008CBA });
                const hsMesh = new THREE.Mesh(hsGeo, hsMat);
                hsGroup.add(hsMesh);

                // Salva i dati della destinazione nell'oggetto
                hsGroup.userData = { target: hs.target };

                scene.add(hsGroup);
                interactiveObjects.push(hsMesh); // Aggiunge alla lista degli oggetti cliccabili
            });
        }

        // Gestione del click del Grilletto (Trigger)
        function onSelectStart(event) {
            const controller = event.target;
            tempMatrix.identity().extractRotation(controller.matrixWorld);

            raycaster.ray.origin.setFromMatrixPosition(controller.matrixWorld);
            raycaster.ray.direction.set(0, 0, -1).applyMatrix4(tempMatrix);

            const intersects = raycaster.intersectObjects(interactiveObjects);

            if (intersects.length > 0) {
                const hitMesh = intersects[0].object;
                const targetScene = hitMesh.parent.userData.target;
                if (targetScene) {
                    loadScene(targetScene);
                }
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function render() {
            renderer.render(scene, camera);
        }

        async function startVR() {
            if (!navigator.xr) {
                alert("WebXR non supportato.");
                return;
            }

            try {
                const session = await navigator.xr.requestSession('immersive-vr', {
                    optionalFeatures: ['local-floor', 'bounded-floor']
                });
                renderer.xr.setSession(session);
                document.getElementById('vr-button').style.display = 'none';

                session.addEventListener('end', () => {
                    document.getElementById('vr-button').style.display = 'block';
                });
            } catch (e) {
                alert("Impossibile avviare la VR: " + e.message);
            }
        }

        window.onload = init;
    </script>
</body>
</html>
